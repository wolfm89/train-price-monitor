default_install_hook_types: [pre-commit, post-checkout]
# Keep the existing hooks out of the post-checkout stage; only worktree-init runs there.
# Add any future hook type here (for example pre-push) or its default-staged hooks stay disabled.
default_stages: [pre-commit, manual]

default_language_version:
  node: system

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: mixed-line-ending
        args: ['--fix=lf']
        description: Forces to replace line ending by the UNIX 'lf' character.
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']

  - repo: https://github.com/34j/mirrors-prettier
    rev: 'v3.10.1'
    hooks:
      - id: prettier

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: 'v10.15.0'
    hooks:
      - id: eslint
        types: [file]
        types_or: [javascript, jsx, ts, tsx]
        args: ['--max-warnings=0', '--no-warn-ignored', '--config', 'eslint.config.cjs']
        additional_dependencies:
          - 'eslint@10.15.0'
          - '@typescript-eslint/eslint-plugin@8.72.2'
          - '@typescript-eslint/parser@8.72.2'
          - 'typescript@5.9.3'
          - 'globals@17.14.0'
          - 'eslint-plugin-awscdk@4.4.4'

  # analytics/ is the only Python module. ruff replaces both eslint and prettier there. The hooks
  # are not path-filtered: a stray .py outside analytics/ should be caught, not silently skipped.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.17.5'
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format

  # Keeps analytics/uv.lock in step with pyproject.toml; CI additionally runs `uv sync --frozen`.
  # Project-scoped checks are too slow for every commit and need each module's dependencies.
  # They run in CI and on demand: pre-commit run --all-files --hook-stage manual
  - repo: local
    hooks:
      # Seeds ignored local files into new linked worktrees. See scripts/worktree-init.sh.
      - id: worktree-init
        name: seed worktree local files
        entry: bash scripts/worktree-init.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [post-checkout]
      - id: typecheck-frontend
        name: tsc (frontend)
        entry: npm --prefix frontend run typecheck
        <<: &typecheck
          language: system
          pass_filenames: false
          stages: [manual]
      - id: typecheck-backend
        name: tsc (backend)
        entry: npm --prefix backend run typecheck
        <<: *typecheck
      - id: typecheck-scraper
        name: tsc (scraper)
        entry: npm --prefix scraper run typecheck
        <<: *typecheck
      - id: typecheck-infrastructure
        name: tsc (infrastructure)
        entry: npm --prefix infrastructure run typecheck
        <<: *typecheck
      - id: typecheck-analytics
        name: ty (analytics)
        entry: uv run --directory analytics --group train ty check
        <<: *typecheck

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: '0.13.8'
    hooks:
      - id: uv-lock
        args: ['--directory', 'analytics', '--check']
        files: ^analytics/(pyproject\.toml|uv\.lock)$
