default_language_version:
  node: system

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: mixed-line-ending
        args: ['--fix=lf']
        description: Forces to replace line ending by the UNIX 'lf' character.
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']

  - repo: https://github.com/34j/mirrors-prettier
    rev: 'v3.10.1'
    hooks:
      - id: prettier

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: 'v10.15.0'
    hooks:
      - id: eslint
        args: ['--max-warnings=0', '--config', 'eslint.config.cjs']
        additional_dependencies:
          - 'eslint@10.15.0'
          - '@typescript-eslint/eslint-plugin@8.72.2'
          - '@typescript-eslint/parser@8.72.2'
          - 'typescript@5.9.3'
          - 'globals@17.14.0'
          - 'eslint-plugin-awscdk@4.4.4'

  # analytics/ is the only Python module. ruff replaces both eslint and prettier there. The hooks
  # are not path-filtered: a stray .py outside analytics/ should be caught, not silently skipped.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.17.5'
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format

  # Keeps analytics/uv.lock in step with pyproject.toml; CI additionally runs `uv sync --frozen`.
  # Project-scoped checks are too slow for every commit and need each module's dependencies.
  # They run in CI and on demand: pre-commit run --all-files --hook-stage manual
  - repo: local
    hooks:
      - id: typecheck-frontend
        name: tsc (frontend)
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        pass_filenames: false
        stages: [manual]
      - id: typecheck-backend
        name: tsc (backend)
        entry: bash -c 'cd backend && npm run typecheck'
        language: system
        pass_filenames: false
        stages: [manual]
      - id: typecheck-scraper
        name: tsc (scraper)
        entry: bash -c 'cd scraper && npm run typecheck'
        language: system
        pass_filenames: false
        stages: [manual]
      - id: typecheck-infrastructure
        name: tsc (infrastructure)
        entry: bash -c 'cd infrastructure && npm run typecheck'
        language: system
        pass_filenames: false
        stages: [manual]
      - id: typecheck-analytics
        name: ty (analytics)
        entry: bash -c 'cd analytics && uv run --frozen ty check'
        language: system
        pass_filenames: false
        stages: [manual]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: '0.13.8'
    hooks:
      - id: uv-lock
        args: ['--directory', 'analytics', '--check']
        files: ^analytics/(pyproject\.toml|uv\.lock)$
