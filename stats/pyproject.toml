[project]
name = "tpm-stats"
version = "0.1.0"
description = "Local data-investigation & visualization for Train Price Monitor scraper data (marimo + DuckDB)."
requires-python = ">=3.12"
dependencies = [
    "marimo[sql]>=0.10",
    "duckdb>=1.1",
    "polars>=1.0",
    "altair>=5.4",
]

[project.optional-dependencies]
dev = ["ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tpm_stats"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# marimo notebooks legitimately use module-level names across cells and
# redefine the throwaway cell function `_`, so relax a few rules for them.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["F811", "B018"]
