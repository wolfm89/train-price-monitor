services:
  floci:
    image: floci/floci:latest-compat
    ports:
      - '4566:4566'
    user: root
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: eu-central-1
      AWS_DEFAULT_REGION: eu-central-1
    volumes:
      - ${XDG_RUNTIME_DIR}/docker.sock:/var/run/docker.sock

  backend:
    build:
      context: backend
      dockerfile: Dockerfile.dev
    ports:
      - 4000:4000
    environment:
      PORT: 4000
      LOCAL_DEV: '1'
      PROFILE_IMAGE_BUCKET_NAME: ${PROFILE_IMAGE_BUCKET_NAME}
      TPM_SQS_QUEUE_URL: ${TPM_SQS_QUEUE_URL}
      AWS_PROFILE: ${AWS_PROFILE}
    volumes:
      - ~/.aws:/root/.aws
      - ./backend:/app
      - /app/node_modules
    working_dir: /app
    command: bash -c 'npm run codegen && npm run dev'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:4000/graphql/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run start
    ports:
      - 3000:3000
    environment:
      REACT_APP_GRAPHQL_ENDPOINT: http://localhost:4000/
      CHOKIDAR_USEPOLLING: true
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
