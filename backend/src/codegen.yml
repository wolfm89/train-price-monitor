schema: 'src/schema/*.graphql'
hooks:
  afterOneFileWrite:
    - 'prettier --write'
generates:
  src/schema/generated/typeDefs.generated.ts:
    plugins:
      - 'typescript'
    config:
      scalars:
        File: File
  src/schema/generated/resolvers.generated.ts:
    plugins:
      - add:
          content: 'import * as Types from "./typeDefs.generated";'
      - 'typescript-resolvers'
    config:
      scalars:
        File: File
      contextType: ../../context#GraphQLContext
      namespacedImportName: Types
      mappers:
        User: ./typeDefs.generated#User
        Notification: ./typeDefs.generated#Notification
