min_version = "2024.9.5"
experimental_monorepo_root = true

[monorepo]
config_roots = ["frontend", "backend", "infrastructure", "scraper"]

[tools]
node    = "24"
aws-cli = "2"

[env]
_.file = '.env'
PROJECT_NAME = "train-price-monitor"
NODE_ENV = "development"
AWS_REGION = "eu-central-1"

[tasks.install]
description = "Install dependencies for all modules"
depends = ["//...:install"]

[tasks."env:local"]
description = "Generate local backend and frontend environment files from CloudFormation"
shell = "bash -c"
run = """
set -euo pipefail

: "${AWS_PROFILE:?Set AWS_PROFILE to an authenticated AWS profile before running this task.}"
STACK_NAME="${STACK_NAME:-InfrastructureStack}"

aws sts get-caller-identity >/dev/null

output_value() {
  local key_prefix="$1"
  local value
  value="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
    --query "Stacks[0].Outputs[?starts_with(OutputKey, '${key_prefix}')].OutputValue | [0]" \
    --output text)"

  if [[ -z "$value" || "$value" == "None" ]]; then
    echo "ERROR: No CloudFormation output starting with '${key_prefix}' was found in ${STACK_NAME}" >&2
    exit 1
  fi

  printf '%s\n' "$value"
}

PROFILE_IMAGE_BUCKET_NAME="$(output_value BackendProfileImageBucketName)"
TPM_SQS_QUEUE_URL="$(output_value BackendQueueUrl)"
COGNITO_USER_POOL_ID="$(output_value CognitoAuthUserPoolId)"
COGNITO_CLIENT_ID="$(aws cognito-idp list-user-pool-clients --user-pool-id "$COGNITO_USER_POOL_ID" --query 'UserPoolClients[0].ClientId' --output text)"
COGNITO_IDENTITY_POOL_ID="$(output_value CognitoAuthIdentityPoolId)"

if [[ -z "$COGNITO_CLIENT_ID" || "$COGNITO_CLIENT_ID" == "None" ]]; then
  echo "ERROR: No Cognito app client was found for user pool ${COGNITO_USER_POOL_ID}" >&2
  exit 1
fi

cat > backend/.env <<EOF
AWS_PROFILE=$AWS_PROFILE
PROFILE_IMAGE_BUCKET_NAME=$PROFILE_IMAGE_BUCKET_NAME
TPM_SQS_QUEUE_URL=$TPM_SQS_QUEUE_URL
EOF

cat > frontend/.env <<EOF
REACT_APP_COGNITO_USER_POOL_ID=$COGNITO_USER_POOL_ID
REACT_APP_COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID
REACT_APP_COGNITO_IDENTITY_POOL_ID=$COGNITO_IDENTITY_POOL_ID
REACT_APP_AWS_REGION=$AWS_REGION
EOF

cat > frontend/.env.development <<EOF
REACT_APP_GRAPHQL_ENDPOINT=http://localhost:4000/
EOF

echo "Generated backend/.env, frontend/.env, and frontend/.env.development from $STACK_NAME"
"""

[tasks."dev:frontend"]
description = "Start frontend dev server"
depends = ["//frontend:dev"]

[tasks."dev:backend"]
description = "Start backend dev server (native, no Docker)"
depends = ["//backend:dev"]

[tasks."dev:docker"]
description = "Start full stack with Docker Compose"
run = "docker compose up"

[tasks.build]
description = "Build all modules"
depends = ["//...:build"]

[tasks.lint]
alias = "l"
description = "Run ESLint on all modules"
depends = ["//...:lint"]

[tasks.test]
description = "Run tests"
depends = ["//...:test"]

[tasks.typecheck]
description = "Typecheck all modules"
depends = ["//...:typecheck"]

[tasks.deploy]
description = "Deploy all CDK stacks to AWS"
depends = ["//infrastructure:deploy"]

[tasks.clean]
description = "Remove build artifacts in all modules"
depends = ["//...:clean"]
