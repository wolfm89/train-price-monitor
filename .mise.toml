min_version = "2024.9.5"
monorepo_root = true

[monorepo]
config_roots = ["frontend", "backend", "infrastructure", "scraper", "analytics", "shared"]

[tools]
node    = "24"
aws-cli = "2"
uv      = "0.13.8"

[env]
_.file = '.env'
PROJECT_NAME = "train-price-monitor"
NODE_ENV = "development"
AWS_REGION = "eu-central-1"

[tasks.install]
description = "Install dependencies for all modules"
depends = ["//...:install"]

[tasks."env:local"]
description = "Generate local backend and frontend environment files from CloudFormation"
run = "scripts/generate-local-env.sh"

[tasks."dev:frontend"]
description = "Start frontend dev server"
depends = ["//frontend:dev"]

[tasks."dev:backend"]
description = "Start backend dev server (native, no Docker)"
depends = ["//backend:dev"]

[tasks."dev:docker"]
description = "Start full stack with Docker Compose"
run = "docker compose up"

[tasks."serve:frontend"]
description = "Serve the built frontend (low-footprint, no hot reload)"
depends = ["//frontend:serve"]

[tasks."serve:backend"]
description = "Serve the compiled backend (low-footprint, no hot reload)"
depends = ["//backend:serve"]

[tasks.serve]
description = "Serve built frontend and compiled backend (low memory, no hot reload)"
# Build sequentially first: the builds are the cold-start memory peak. Then run
# both servers concurrently even when MISE_JOBS=1, which would otherwise let the
# first long-running `depends` block the second. `mise run -j 2` also propagates
# a failing task's exit code and prefixes each server's output.
run = "mise run //frontend:build:serve && mise run //backend:build:serve && mise run -j 2 //frontend:serve ::: //backend:serve"

[tasks.build]
description = "Build all modules"
depends = ["//...:build"]

[tasks.lint]
alias = "l"
description = "Run linters on all modules"
depends = ["//...:lint"]

[tasks.test]
description = "Run tests"
depends = ["//...:test"]

[tasks.typecheck]
description = "Typecheck all modules"
depends = ["//...:typecheck"]

[tasks.deploy]
description = "Deploy all CDK stacks to AWS"
depends = ["//infrastructure:deploy"]

[tasks.clean]
description = "Remove build artifacts in all modules"
depends = ["//...:clean"]
