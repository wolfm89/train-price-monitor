[project]
name = "tpm-analytics"
version = "0.1.0"
description = "Silver-layer builds for the Train Price Monitor price dataset"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["duckdb==1.5.3"]

[dependency-groups]
dev = [
  "pyarrow==26.0.1",
  "pytest==9.2.0",
  "ruff==0.17.5",
  "ty==0.0.104",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
