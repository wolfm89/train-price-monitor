[env]
UV_FROZEN = "1"

[tasks.install]
description = "Create the uv environment from the lockfile"
run = "uv sync --group train"

[tasks.build]
description = "Build the wheel and sdist (assets included)"
run = "uv build"

[tasks.typecheck]
description = "Type check with ty"
run = "uv run --group train ty check"

[tasks.test]
description = "Run the fixture tests"
run = "uv run --group train pytest"

[tasks.lint]
description = "Lint with ruff"
run = "uv run ruff check . && uv run ruff format --check ."

[tasks.format]
description = "Format with ruff"
run = "uv run ruff format ."

[tasks.httpfs]
description = "Install DuckDB httpfs into .duckdb-extensions for local S3 reads"
run = "uv run python scripts/install_httpfs.py"

[tasks.calendar]
description = "Regenerate the German holiday calendar from OpenHolidays"
run = "uv run python scripts/build_calendar.py"

[tasks."calendar:check"]
description = "Check the committed holiday calendar against OpenHolidays"
run = "uv run python scripts/build_calendar.py --check"

[tasks.image]
description = "Build the Lambda container image"
run = "docker build -t train-price-monitor-analytics:dev ."

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf dist .pytest_cache .ruff_cache"

[tasks."silver:local"]
description = "Build silver from a local bronze glob; pass --source <glob> --target <dir> after --"
run = "uv run python -m tpm_analytics.silver.build"

[tasks.train]
description = "Build the baseline training set and report; pass --source <pointer|glob> after --"
run = "uv run --group train python -m tpm_analytics.training.cli"

[tasks."train:profile"]
description = "Profile the training source without training"
run = "uv run --group train python -m tpm_analytics.training.cli --profile"

[tasks."train:ablation"]
description = "Run the four calendar feature sets on one full dataset"
run = "uv run --group train python -m tpm_analytics.training.cli --ablation"

[tasks."train:clean"]
description = "Remove local training artifacts"
run = "rm -rf artifacts"
