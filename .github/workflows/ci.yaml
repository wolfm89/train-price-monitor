name: CI/CD

# One workflow for validation and deployment, so the checks that gate a pull
# request are the same ones that gate a deploy. Previously deploying ran no
# checks at all: a push to main went straight to build-and-deploy.
#
# On a pull request: the four module jobs plus an image build.
# On a push to main: the same module jobs, then deploy.
#
# The image build is pull-request-only because a deploy builds and publishes
# those images through CDK anyway. It exists because the Lambda images copy
# pre-built bundles rather than building inside Docker (the bundles pull in
# ../shared, which sits outside each image's build context). That coupling is
# invisible to typecheck and lint: a missing build step surfaces only as
# `COPY dist/main.js: not found` at image build time, which previously reached
# main and broke the deploy.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are disposable; a deploy in flight is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      # The shared eslint.config.cjs lives at the repo root and resolves its
      # plugins from the root node_modules, so lint needs this as well as the
      # module's own dependencies.
      - name: Install root dependencies
        run: npm ci
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      # The shared eslint.config.cjs lives at the repo root and resolves its
      # plugins from the root node_modules, so lint needs this as well as the
      # module's own dependencies.
      - name: Install root dependencies
        run: npm ci
      - run: npm ci
        working-directory: backend
      # Regenerates the GraphQL types the resolvers are typed against, so a
      # schema change without a matching codegen commit fails here.
      - run: npm run codegen
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - name: Verify generated GraphQL types are committed
        run: git diff --exit-code -- src/schema/generated
        working-directory: backend

  scraper:
    name: Scraper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            scraper/package-lock.json
      # The shared eslint.config.cjs lives at the repo root and resolves its
      # plugins from the root node_modules, so lint needs this as well as the
      # module's own dependencies.
      - name: Install root dependencies
        run: npm ci
      - run: npm ci
        working-directory: scraper
      - run: npm run typecheck
        working-directory: scraper
      - run: npm run lint
        working-directory: scraper
      - run: npm run build
        working-directory: scraper

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            infrastructure/package-lock.json
      # The shared eslint.config.cjs lives at the repo root and resolves its
      # plugins from the root node_modules, so lint needs this as well as the
      # module's own dependencies.
      - name: Install root dependencies
        run: npm ci
      - run: npm ci
        working-directory: infrastructure
      - run: npm run build
        working-directory: infrastructure
      - run: npm run lint
        working-directory: infrastructure
      - run: npm test
        working-directory: infrastructure
  artifacts:
    name: Build & synth
    # Only on pull requests: a deploy performs the equivalent work itself.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # Everything CDK and the images consume is produced here, mirroring the
      # order the deploy job uses. cdk synth needs frontend/build for the
      # BucketDeployment asset, and the images COPY the backend and scraper
      # bundles because those pull in ../shared from outside each build context.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend bundle
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Build scraper bundles
        working-directory: scraper
        run: |
          npm ci
          npm run build

      # Synthesizes with placeholder context so no AWS credentials are needed;
      # catches construct-level errors that tsc and jest do not.
      - name: CDK synth
        working-directory: infrastructure
        run: |
          npm ci
          npx cdk synth --quiet
        env:
          CDK_APP_NAME: ci
          CDK_DOMAIN_NAME: ci.example.com
          CDK_SES_FROM_EMAIL: ci@example.com
          CDK_DEFAULT_ACCOUNT: '111111111111'
          CDK_DEFAULT_REGION: eu-central-1

      - uses: docker/setup-buildx-action@v3

      # linux/amd64 to match the x86_64 Lambda functions.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build scraper poller image
        uses: docker/build-push-action@v6
        with:
          context: scraper
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=scraper
          cache-to: type=gha,scope=scraper,mode=max

  deploy:
    name: Deploy
    # Never on pull requests, and only once every module job is green.
    if: github.event_name != 'pull_request'
    needs: [frontend, backend, scraper, infrastructure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies for frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          REACT_APP_COGNITO_USER_POOL_ID: ${{ secrets.REACT_APP_COGNITO_USER_POOL_ID }}
          REACT_APP_COGNITO_CLIENT_ID: ${{ secrets.REACT_APP_COGNITO_CLIENT_ID }}
          REACT_APP_COGNITO_IDENTITY_POOL_ID: ${{ secrets.REACT_APP_COGNITO_IDENTITY_POOL_ID }}
          REACT_APP_AWS_REGION: ${{ vars.AWS_REGION }}
          REACT_APP_GRAPHQL_ENDPOINT: ${{ secrets.REACT_APP_GRAPHQL_ENDPOINT }}

      - name: Install dependencies for scraper
        working-directory: scraper
        run: npm ci

      - name: Build scraper
        working-directory: scraper
        run: npm run build

      # The backend image copies a pre-built bundle rather than building inside
      # Docker: the bundle pulls in ../shared, which is outside the image's
      # build context. Without this step `COPY dist/main.js` fails at deploy.
      - name: Install dependencies for backend
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install dependencies for infrastructure
        working-directory: infrastructure
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-external-id: ${{ secrets.AWS_ROLE_EXTERNAL_ID }}
          role-duration-seconds: 1200
          role-session-name: GithubWorkflow

      # The Decodo API key is never in a CDK template: CI writes it to an SSM
      # SecureString and the functions read it at runtime via
      # DECODO_API_KEY_PARAM. Secrets are not available in `if:` expressions, so
      # the emptiness check happens in the shell.
      - name: Sync Decodo API key to SSM
        env:
          DECODO_API_KEY: ${{ secrets.DECODO_API_KEY }}
          DECODO_API_KEY_PARAM: ${{ vars.CDK_DECODO_API_KEY_PARAM }}
        run: |
          set -euo pipefail
          PARAM="${DECODO_API_KEY_PARAM:-/train-price-monitor/decodo-api-key}"
          if [[ -z "${DECODO_API_KEY}" ]]; then
            echo "::warning::DECODO_API_KEY is not set; leaving ${PARAM} untouched. The Decodo fallback for search and refresh will not work until it exists."
            exit 0
          fi
          # Rotating the key is just: update the repo secret and re-run this job;
          # running functions pick it up within DECODO_KEY_TTL_MS. Only the
          # parameter version is printed, never the value.
          VERSION="$(aws ssm put-parameter \
            --name "$PARAM" \
            --type SecureString \
            --value "$DECODO_API_KEY" \
            --overwrite \
            --query Version --output text)"
          echo "Wrote ${PARAM} (version ${VERSION})"

      # Pushover credentials for the alarm forwarder (AlertingStack). Same
      # pattern as the Decodo key: CI writes them to SSM SecureStrings and the
      # forwarder reads them at runtime, so neither value is ever in a template.
      - name: Sync Pushover credentials to SSM
        env:
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${PUSHOVER_API_TOKEN}" || -z "${PUSHOVER_USER_KEY}" ]]; then
            echo "::warning::PUSHOVER_API_TOKEN / PUSHOVER_USER_KEY are not set; alarm notifications will not be delivered."
            exit 0
          fi
          for pair in \
            "/train-price-monitor/pushover-token:${PUSHOVER_API_TOKEN}" \
            "/train-price-monitor/pushover-user-key:${PUSHOVER_USER_KEY}"; do
            PARAM="${pair%%:*}"
            VALUE="${pair#*:}"
            VERSION="$(aws ssm put-parameter \
              --name "$PARAM" \
              --type SecureString \
              --value "$VALUE" \
              --overwrite \
              --query Version --output text)"
            echo "Wrote ${PARAM} (version ${VERSION})"
          done

      - name: Synthesize with AWS CDK and show diff
        working-directory: infrastructure
        run: npm run cdk diff
        env:
          CDK_APP_NAME: ${{ secrets.CDK_APP_NAME }}
          CDK_DOMAIN_NAME: ${{ secrets.CDK_DOMAIN_NAME }}
          CDK_SES_FROM_EMAIL: ${{ secrets.CDK_SES_FROM_EMAIL }}
          CDK_DECODO_API_KEY_PARAM: ${{ vars.CDK_DECODO_API_KEY_PARAM }}
          CDK_SCRAPER_PAUSED: ${{ vars.CDK_SCRAPER_PAUSED }}

      - name: Deploy with AWS CDK
        working-directory: infrastructure
        run: npm run cdk -- --app cdk.out deploy --require-approval never --all
        env:
          CDK_APP_NAME: ${{ secrets.CDK_APP_NAME }}
          CDK_DOMAIN_NAME: ${{ secrets.CDK_DOMAIN_NAME }}
          CDK_SES_FROM_EMAIL: ${{ secrets.CDK_SES_FROM_EMAIL }}
          CDK_DECODO_API_KEY_PARAM: ${{ vars.CDK_DECODO_API_KEY_PARAM }}
          CDK_SCRAPER_PAUSED: ${{ vars.CDK_SCRAPER_PAUSED }}

      - name: Invalidate CloudFront cache
        uses: badsyntax/github-action-aws-cloudfront@master
        with:
          aws-region: ${{ vars.AWS_REGION }}
          distribution-id: ${{ secrets.DISTRIBUTION_ID }}
          invalidate-paths: '*'
          default-root-object: 'index.html'
          include-origin-prefix: false
